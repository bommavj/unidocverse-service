    processing_path: math

    # Stronger keyword detection
    keywords:
      - csv
      - excel
      - dataset
      - data
      - table
      - rows
      - columns
      - rating
      - score
      - id
      - value
      - amount

    # File extensions alone should be enough to classify
    file_extensions:
      - .xlsx
      - .xls
      - .csv

    # Filename patterns
    filename_patterns:
      - '.*\.(xlsx|xls|csv)$'
      - '.*ratings.*'
      - '.*data.*'
      - '.*table.*'

    # Optional: detect column‑like structure
    structural_patterns:
      - '.*,.*,.*,.*'     # CSV with multiple commas
      - '^[A-Za-z0-9_ ]+,.*$'  # header row

    math_operations:
      - sum: [ total, amount, value ]
      - average: [ price, cost, rating, score ]
      - count: [ rows, records, movies ]


# ==================== ENTITY EXTRACTION PATTERNS ====================
entity_patterns:
  order_id:
    patterns:
      - 'order[_\s#-]*([A-Z0-9]{6,})'
      - 'po[_\s#-]*([A-Z0-9]{6,})'
    priority: high

  invoice_number:
    patterns:
      - 'invoice[_\s#-]*([A-Z0-9]{6,})'
      - 'inv[_\s#-]*([A-Z0-9]{6,})'
    priority: high

  email:
    patterns:
      - '\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Z|a-z]{2,}\b'
    priority: medium

  phone:
    patterns:
      - '\b\d{3}[-.]?\d{3}[-.]?\d{4}\b'
      - '\+\d{1,3}\s?\d{3,}'
    priority: medium

  customer_id:
    patterns:
      - 'customer[_\s#-]*([A-Z0-9]{4,})'
      - 'cust[_\s#-]*([A-Z0-9]{4,})'
    priority: high

  product_id:
    patterns:
      - 'product[_\s#-]*([A-Z0-9]{4,})'
      - 'sku[_\s#-]*([A-Z0-9]{4,})'
    priority: high

  transaction_id:
    patterns:
      - 'trans(action)?[_\s#-]*([A-Z0-9]{6,})'
      - 'txn[_\s#-]*([A-Z0-9]{6,})'
    priority: high

  account_number:
    patterns:
      - 'account[_\s#-]*(\d{8,})'
      - 'acct[_\s#-]*(\d{8,})'
    priority: high

# ==================== PROCESSING CONFIGURATION ====================
processing:
  math_path:
    max_rows: 100000
    precision: 2
    currency_symbol: "$"

  logic_path:
    max_text_length: 15000
    model: "mistral:7b"
    temperature: 0.1