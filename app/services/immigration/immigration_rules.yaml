# Immigration case rules as data. Filing windows and evidence lists are general
# guidance from USCIS practice — verify against current USCIS form instructions
# before relying on them for a filing.

statuses: [intake, preparing, ready_to_file, filed, rfe, rfe_responded, approved, denied, withdrawn]

case_types:
  h1b_extension:
    label: "H-1B extension / amendment"
    form: I-129
    visa_class: H-1B
    file_window_days: 180          # can be filed up to 6 months before the current H-1B expires
    intake_sections: [personal, immigration, employment, education]
    evidence:
      - "Passport (valid at least 6 months)"
      - "Current and prior I-797 approval notices"
      - "Most recent I-94 record"
      - "Certified Labor Condition Application (ETA-9035)"
      - "Employer support letter / job description"
      - "Recent pay stubs (last 2-3 months)"
      - "Degree certificate and transcripts (or credential evaluation)"
      - "Resume"
  h1b_transfer:
    label: "H-1B change of employer"
    form: I-129
    visa_class: H-1B
    intake_sections: [personal, immigration, employment, education]
    evidence:
      - "Passport"
      - "All prior I-797 approval notices"
      - "Most recent I-94 record"
      - "Certified Labor Condition Application (ETA-9035) from the new employer"
      - "Offer letter from the new employer"
      - "Last pay stubs from the current employer"
      - "Degree certificate and transcripts (or credential evaluation)"
      - "Resume"
  h4_extension:
    label: "H-4 extension (dependent)"
    form: I-539
    visa_class: H-4
    file_window_days: 180
    intake_sections: [personal, immigration, family]
    evidence:
      - "Passport"
      - "Principal's I-797 approval (H-1B)"
      - "Dependent's current I-797 and I-94"
      - "Marriage certificate (spouse) or birth certificate (child)"
  h4_ead:
    label: "H-4 EAD (work authorization)"
    form: I-765
    visa_class: H-4
    file_window_days: 180
    intake_sections: [personal, immigration, family]
    evidence:
      - "Passport"
      - "H-4 I-797 and I-94"
      - "Principal's approved I-140 or H-1B extension under AC21 evidence"
      - "Marriage certificate"
      - "Two passport-style photos"
      - "Prior EAD card (if renewing)"
  ead_renewal:
    label: "EAD renewal"
    form: I-765
    file_window_days: 180          # renewals can be filed up to 180 days before the card expires
    intake_sections: [personal, immigration]
    evidence:
      - "Front and back of current EAD"
      - "Passport"
      - "Most recent I-94 record"
      - "Two passport-style photos"
      - "Evidence of the underlying eligibility category"
  i140:
    label: "Immigrant petition for alien worker"
    form: I-140
    intake_sections: [personal, immigration, employment, education]
    evidence:
      - "Approved PERM labor certification (if required)"
      - "Employer's ability-to-pay evidence"
      - "Degree certificates, transcripts, credential evaluation"
      - "Experience letters from prior employers"
      - "Passport and I-94"
  i485:
    label: "Adjustment of status (green card)"
    form: I-485
    intake_sections: [personal, immigration, employment, family, history]
    evidence:
      - "Birth certificate (with certified translation if not in English)"
      - "Passport and all visas"
      - "Most recent I-94 record"
      - "Approval notice of the underlying petition (I-140 / I-130)"
      - "Medical exam (Form I-693)"
      - "Two passport-style photos"
      - "Employment verification letter or Affidavit of Support (I-864) for family cases"
      - "Court and police records, if any"
  i130:
    label: "Petition for alien relative"
    form: I-130
    intake_sections: [personal, family, history]
    evidence:
      - "Petitioner's proof of U.S. citizenship or permanent residence"
      - "Marriage certificate or birth certificate proving the relationship"
      - "Proof any prior marriages ended (divorce / death certificates)"
      - "Evidence of a bona fide marriage (joint lease, bank accounts, photos)"
      - "Passport-style photos of petitioner and beneficiary"
  i90:
    label: "Green card renewal / replacement"
    form: I-90
    file_window_days: 180          # renew within 6 months of the card's expiration
    intake_sections: [personal, immigration]
    evidence:
      - "Copy of the current green card (front and back)"
      - "Government-issued photo ID"
  n400:
    label: "Naturalization"
    form: N-400
    file_window_days: 90           # may file up to 90 days before the 5-year (or 3-year) residence anniversary
    intake_sections: [personal, immigration, employment, family, history]
    evidence:
      - "Green card (front and back)"
      - "Travel history for the statutory period"
      - "Tax returns / transcripts for the statutory period"
      - "Marriage certificate (3-year marriage-based filing)"
      - "Court and police records, if any"
  passport_renewal:
    label: "Passport renewal (foreign passport)"
    form: "Consulate"
    file_window_days: 270          # many countries and visas need 6+ months of passport validity
    intake_sections: [personal]
    evidence:
      - "Current passport"
      - "Passport photos"
      - "Proof of U.S. status (I-797 / visa / I-94)"

  h1b_cap:
    label: "H-1B new (cap) petition"
    form: I-129
    visa_class: H-1B
    intake_sections: [personal, immigration, employment, education]
    evidence:
      - "H-1B registration selection notice"
      - "Certified Labor Condition Application (ETA-9035)"
      - "Employer support letter / job description"
      - "Degree certificate and transcripts (or credential evaluation)"
      - "Passport"
      - "Current status documents (I-94, I-20 / EAD if in the US)"
  h1b_amendment:
    label: "H-1B amendment (worksite or job change)"
    form: I-129
    visa_class: H-1B
    intake_sections: [personal, immigration, employment]
    evidence:
      - "New certified LCA for the new worksite"
      - "Current I-797 approval notice"
      - "Updated job description / client letter"
      - "Recent pay stubs"
  l1:
    label: "L-1A / L-1B intracompany transferee"
    form: I-129
    visa_class: L-1
    intake_sections: [personal, immigration, employment, education]
    evidence:
      - "Proof of one year of employment abroad with the related company in the last three years"
      - "Evidence of the qualifying relationship between the companies"
      - "Organisation charts (US and abroad)"
      - "Job descriptions abroad and in the US (managerial / specialized knowledge)"
      - "Passport"
  l2:
    label: "L-2 dependent"
    form: I-539
    visa_class: L-2
    intake_sections: [personal, immigration, family]
    evidence:
      - "Passport"
      - "Principal's L-1 approval and I-94"
      - "Marriage certificate (spouse) or birth certificate (child)"
  o1:
    label: "O-1 extraordinary ability"
    form: I-129
    visa_class: O-1
    intake_sections: [personal, immigration, employment, education]
    evidence:
      - "Evidence meeting at least three O-1 criteria (awards, publications, judging, high salary …)"
      - "Advisory opinion (consultation) from a peer group or labor organisation"
      - "Itinerary and contracts for the period requested"
      - "Passport"
  o3:
    label: "O-3 dependent"
    form: I-539
    visa_class: O-3
    intake_sections: [personal, immigration, family]
    evidence:
      - "Passport"
      - "Principal's O-1 approval"
      - "Marriage or birth certificate"
  tn:
    label: "TN (USMCA professional)"
    form: I-129
    visa_class: TN
    intake_sections: [personal, immigration, employment, education]
    evidence:
      - "Proof of Canadian or Mexican citizenship"
      - "Offer letter describing a USMCA profession"
      - "Degree / licence required for the profession"
  td:
    label: "TD dependent"
    form: I-539
    visa_class: TD
    intake_sections: [personal, immigration, family]
    evidence:
      - "Passport"
      - "Principal's TN approval or I-94"
      - "Marriage or birth certificate"
  e3:
    label: "E-3 (Australian specialty occupation)"
    form: I-129
    visa_class: E-3
    intake_sections: [personal, immigration, employment, education]
    evidence:
      - "Australian passport"
      - "Certified Labor Condition Application (ETA-9035)"
      - "Offer letter / job description"
      - "Degree certificate"
  e2:
    label: "E-2 treaty investor"
    form: I-129
    visa_class: E-2
    intake_sections: [personal, immigration, employment]
    evidence:
      - "Passport showing treaty nationality"
      - "Evidence of the investment and its source of funds"
      - "Business plan and company documents"
  f1_opt:
    label: "F-1 OPT (post-completion work permit)"
    form: I-765
    visa_class: F-1
    intake_sections: [personal, immigration, education]
    evidence:
      - "I-20 with the DSO's OPT recommendation"
      - "Passport and I-94"
      - "Two passport-style photos"
  stem_opt:
    label: "F-1 STEM OPT extension"
    form: I-765
    visa_class: F-1
    file_window_days: 90           # file within 90 days before the current OPT EAD expires
    intake_sections: [personal, immigration, education, employment]
    evidence:
      - "I-20 with the STEM OPT recommendation"
      - "Form I-983 training plan signed by the employer"
      - "Current OPT EAD"
      - "STEM degree certificate"
      - "Employer's E-Verify number"
  j1:
    label: "J-1 exchange visitor"
    form: "DS-2019 (sponsor)"
    visa_class: J-1
    intake_sections: [personal, immigration, education]
    evidence:
      - "DS-2019 from the program sponsor"
      - "Passport"
      - "SEVIS fee receipt"
      - "Note: 212(e) two-year home residency requirement may apply"
  j2:
    label: "J-2 dependent"
    form: "DS-2019 (sponsor)"
    visa_class: J-2
    intake_sections: [personal, immigration, family]
    evidence:
      - "Own DS-2019"
      - "Passport"
      - "Marriage or birth certificate"
  b_extension:
    label: "B-1 / B-2 visitor extension"
    form: I-539
    visa_class: B-2
    intake_sections: [personal, immigration]
    evidence:
      - "Most recent I-94 (file before it expires)"
      - "Passport"
      - "Reason for the extension and proof of funds"
      - "Return ticket or travel plans"
  r1:
    label: "R-1 religious worker"
    form: I-129
    visa_class: R-1
    intake_sections: [personal, immigration, employment]
    evidence:
      - "Evidence of the religious organisation's tax-exempt status"
      - "Proof of two years' membership in the denomination"
      - "Job offer and compensation details"
  eb1a:
    label: "EB-1A extraordinary ability green card"
    form: I-140
    intake_sections: [personal, immigration, employment, education]
    evidence:
      - "Evidence meeting at least three of the ten criteria, or a major internationally recognised award"
      - "Expert recommendation letters"
      - "Evidence of continuing work in the field"
  eb1b_eb1c:
    label: "EB-1B researcher / EB-1C multinational manager"
    form: I-140
    intake_sections: [personal, immigration, employment, education]
    evidence:
      - "Permanent job offer (EB-1B) or proof of managerial role abroad and in the US (EB-1C)"
      - "Publications, citations and recommendation letters (EB-1B)"
      - "Organisation charts and corporate relationship evidence (EB-1C)"
  eb2_niw:
    label: "EB-2 National Interest Waiver"
    form: I-140
    intake_sections: [personal, immigration, employment, education]
    evidence:
      - "Advanced degree or exceptional ability evidence"
      - "Proposed endeavour statement and its national importance"
      - "Recommendation letters and record of achievement"
  eb5:
    label: "EB-5 immigrant investor"
    form: I-526E
    intake_sections: [personal, immigration, employment, history]
    evidence:
      - "Proof of investment"
      - "Lawful source-of-funds documentation"
      - "Regional center / project documents"
  k1:
    label: "K-1 fiancé(e)"
    form: I-129F
    intake_sections: [personal, family, history]
    evidence:
      - "Petitioner's proof of U.S. citizenship"
      - "Evidence the couple met in person within the last two years"
      - "Statements of intent to marry within 90 days"
      - "Proof prior marriages ended"
  i751:
    label: "Remove conditions on residence"
    form: I-751
    file_window_days: 90           # file in the 90 days before the 2-year card expires
    intake_sections: [personal, family]
    evidence:
      - "Conditional green card (front and back)"
      - "Evidence of the ongoing marriage (joint tax returns, lease, accounts, children's birth certificates)"
      - "Marriage certificate"
intake_sections:
  personal:
    title: "About you"
    fields:
      - {key: full_name, label: "Full legal name (as on passport)", required: true}
      - {key: other_names, label: "Other names used"}
      - {key: date_of_birth, label: "Date of birth", type: date, required: true}
      - {key: country_of_birth, label: "Country of birth", required: true}
      - {key: citizenship, label: "Country of citizenship", required: true}
      - {key: passport_number, label: "Passport number", sensitive: true}
      - {key: passport_expiry, label: "Passport expiration date", type: date}
      - {key: us_address, label: "Current U.S. address", type: textarea}
      - {key: phone, label: "Phone"}
      - {key: email, label: "Email", type: email}
      - {key: marital_status, label: "Marital status", type: select, options: [Single, Married, Divorced, Widowed]}
  immigration:
    title: "Your immigration status"
    fields:
      - {key: a_number, label: "A-Number (if any)", sensitive: true}
      - {key: current_status, label: "Current status / visa class (e.g. H-1B)"}
      - {key: status_expiry, label: "Status expiration (I-94 / I-797 date)", type: date}
      - {key: i94_number, label: "Most recent I-94 number", sensitive: true}
      - {key: last_entry_date, label: "Date of last entry to the U.S.", type: date}
      - {key: last_entry_port, label: "Port of last entry"}
  employment:
    title: "Employment"
    fields:
      - {key: employer, label: "Current employer"}
      - {key: job_title, label: "Job title"}
      - {key: employment_start, label: "Start date", type: date}
      - {key: annual_salary, label: "Annual salary (USD)", type: number}
      - {key: work_address, label: "Work site address", type: textarea}
  education:
    title: "Education"
    fields:
      - {key: highest_degree, label: "Highest degree"}
      - {key: field_of_study, label: "Field of study"}
      - {key: university, label: "University"}
      - {key: graduation_year, label: "Year awarded", type: number}
  family:
    title: "Family"
    fields:
      - {key: spouse_name, label: "Spouse's full name"}
      - {key: spouse_dob, label: "Spouse's date of birth", type: date}
      - {key: marriage_date, label: "Date of marriage", type: date}
      - {key: children, label: "Children (name and date of birth, one per line)", type: textarea}
  history:
    title: "History"
    fields:
      - {key: prior_denials, label: "Have you ever been denied a visa or immigration benefit?", type: select, options: ["No", "Yes"]}
      - {key: status_violations, label: "Have you ever overstayed or violated status?", type: select, options: ["No", "Yes"]}
      - {key: arrests, label: "Have you ever been arrested or charged with a crime?", type: select, options: ["No", "Yes"]}
      - {key: history_details, label: "If yes to any, explain", type: textarea}

languages: {en: English, es: Spanish, hi: Hindi, te: Telugu, zh: Chinese, pt: Portuguese, fr: French, vi: Vietnamese, ko: Korean, ar: Arabic}
