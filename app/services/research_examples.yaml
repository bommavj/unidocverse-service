# ─────────────────────────────────────────────────────────────────────────────
# Research Examples — Dynamic Few-Shot Library
#
# Each entry has:
#   q        : the example question (used for embedding + similarity lookup)
#   a        : the JSON answer (injected verbatim into the prompt)
#   intent   : for filtering / analytics
#   doc_type : for filtering / analytics
#
# At startup these are embedded with the same sentence-transformer used for
# chunk search. At query time the top-N most similar examples are selected
# and injected into the REASONER_PROMPT instead of a fixed set.
# ─────────────────────────────────────────────────────────────────────────────

