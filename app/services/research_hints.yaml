# ── Month aliases ─────────────────────────────────────────────────────────────
# Used for date extraction and filename matching.
months:
  january:  { abbr: jan, num: "01" }
  february: { abbr: feb, num: "02" }
  march:    { abbr: mar, num: "03" }
  april:    { abbr: apr, num: "04" }
  may:      { abbr: may, num: "05" }
  june:     { abbr: jun, num: "06" }
  july:     { abbr: jul, num: "07" }
  august:   { abbr: aug, num: "08" }
  september: { abbr: sep, num: "09" }
  october:  { abbr: oct, num: "10" }
  november: { abbr: nov, num: "11" }
  december: { abbr: dec, num: "12" }


# ── Scoring weights ───────────────────────────────────────────────────────────
scoring:
  date_month_and_year:    3   # both month + year match filename
  date_partial:           2   # only month or only year matches
  doc_type_match:         2   # doc_type_hint keywords match filename/db type
  field_in_filename:      1   # field or synonym appears in filename
  named_subject_match:   30   # all named_subject tokens found in filename/metadata → strong boost
  named_subject_partial: 10   # partial named_subject token match
  min_score_to_include:   1   # documents scoring below this are excluded


# ── Date label patterns ───────────────────────────────────────────────────────
# {pattern: regex matched before the date value, field: stored key}
# Covers: payroll, banking, invoices, insurance, medical, legal, real estate,
#         supply chain, immigration, HR, tax, contracts, utilities, investment
date_patterns:
  # ── Payroll ──
  - {pattern: 'period\s+begin(?:ning)?[\s:]+',               field: period_start}
  - {pattern: 'period\s+end(?:ing)?[\s:]+',                  field: period_end}
  - {pattern: '(?:pay|check|payment)\s+date[\s:]+',          field: pay_date}
  - {pattern: 'pay\s+period[\s:]+',                          field: period_start}
  - {pattern: 'check\s+period[\s:]+',                        field: period_start}
  - {pattern: 'earnings\s+period[\s:]+',                     field: period_start}
  - {pattern: 'work\s+period[\s:]+',                         field: period_start}
  - {pattern: 'payroll\s+date[\s:]+',                        field: pay_date}
  - {pattern: 'deposit\s+date[\s:]+',                        field: pay_date}
  # ── Banking / Financial ──
  - {pattern: 'statement\s+(?:period|date)[\s:]+',           field: period_start}
  - {pattern: 'statement\s+(?:end|closing)\s+date[\s:]+',    field: period_end}
  - {pattern: 'account\s+open(?:ed|ing)?\s+date[\s:]+',      field: period_start}
  - {pattern: 'transaction\s+date[\s:]+',                    field: period_start}
  - {pattern: 'posting\s+date[\s:]+',                        field: period_start}
  - {pattern: 'value\s+date[\s:]+',                          field: period_start}
  - {pattern: 'settlement\s+date[\s:]+',                     field: period_start}
  - {pattern: 'trade\s+date[\s:]+',                          field: period_start}
  - {pattern: 'maturity\s+date[\s:]+',                       field: period_end}
  - {pattern: 'interest\s+(?:through|to)\s+date[\s:]+',      field: period_end}
  - {pattern: 'cycle\s+(?:end|close)\s+date[\s:]+',          field: period_end}
  # ── Invoices / Billing ──
  - {pattern: 'invoice\s+date[\s:]+',                        field: period_start}
  - {pattern: 'billing\s+(?:period|date)[\s:]+',             field: period_start}
  - {pattern: 'bill\s+date[\s:]+',                           field: period_start}
  - {pattern: 'due\s+date[\s:]+',                            field: due_date}
  - {pattern: 'payment\s+due[\s:]+',                         field: due_date}
  - {pattern: 'net\s+(?:30|60|90)\s+due[\s:]+',              field: due_date}
  - {pattern: 'purchase\s+(?:order\s+)?date[\s:]+',          field: period_start}
  - {pattern: 'order\s+date[\s:]+',                          field: period_start}
  - {pattern: 'ship(?:ment|ping|ped)?\s+date[\s:]+',         field: ship_date}
  - {pattern: 'delivery\s+date[\s:]+',                       field: delivery_date}
  - {pattern: 'receipt\s+date[\s:]+',                        field: period_start}
  - {pattern: 'receipt\s+of\s+goods[\s:]+',                  field: period_start}
  # ── Insurance ──
  - {pattern: 'coverage\s+(?:period|date|begin\w*|start)[\s:]+', field: period_start}
  - {pattern: 'coverage\s+(?:end|expir\w*)[\s:]+',           field: period_end}
  - {pattern: 'policy\s+(?:effective|start|begin\w*)[\s:]+', field: period_start}
  - {pattern: 'policy\s+(?:expir\w*|end|term\w*)[\s:]+',     field: period_end}
  - {pattern: 'claim\s+date[\s:]+',                          field: period_start}
  - {pattern: 'claim\s+(?:received|filed|submitted)[\s:]+',  field: period_start}
  - {pattern: 'renewal\s+date[\s:]+',                        field: period_end}
  - {pattern: 'underwriting\s+date[\s:]+',                   field: period_start}
  # ── Medical / Healthcare ──
  - {pattern: 'date\s+of\s+service[\s:]+',                   field: period_start}
  - {pattern: 'service\s+(?:period|date)[\s:]+',             field: period_start}
  - {pattern: 'admission\s+date[\s:]+',                      field: period_start}
  - {pattern: 'discharge\s+date[\s:]+',                      field: period_end}
  - {pattern: 'date\s+of\s+(?:birth|dob)[\s:]+',             field: date_of_birth}
  - {pattern: 'dob[\s:]+',                                   field: date_of_birth}
  - {pattern: 'lab\s+(?:date|collected|drawn)[\s:]+',        field: period_start}
  - {pattern: 'specimen\s+(?:date|collected)[\s:]+',         field: period_start}
  - {pattern: 'report\s+date[\s:]+',                         field: period_start}
  - {pattern: 'result\s+date[\s:]+',                         field: period_start}
  - {pattern: 'prescription\s+date[\s:]+',                   field: period_start}
  - {pattern: 'fill\s+date[\s:]+',                           field: period_start}
  - {pattern: 'next\s+refill[\s:]+',                         field: period_end}
  - {pattern: 'appointment\s+date[\s:]+',                    field: period_start}
  - {pattern: 'visit\s+date[\s:]+',                          field: period_start}
  # ── Legal / Contracts ──
  - {pattern: '(?:effective|start|begin)\s+date[\s:]+',      field: period_start}
  - {pattern: '(?:end|expir\w*|terminat\w*)\s+date[\s:]+',   field: period_end}
  - {pattern: '(?:filing|filed)\s+date[\s:]+',               field: period_start}
  - {pattern: '(?:issue|issued)\s+date[\s:]+',               field: period_start}
  - {pattern: 'execution\s+date[\s:]+',                      field: period_start}
  - {pattern: 'agreement\s+date[\s:]+',                      field: period_start}
  - {pattern: 'signing\s+date[\s:]+',                        field: period_start}
  - {pattern: 'hearing\s+date[\s:]+',                        field: hearing_date}
  - {pattern: 'trial\s+date[\s:]+',                          field: hearing_date}
  - {pattern: 'judgment\s+date[\s:]+',                       field: period_start}
  - {pattern: 'deposition\s+date[\s:]+',                     field: period_start}
  - {pattern: 'notice\s+date[\s:]+',                         field: period_start}
  - {pattern: 'default\s+date[\s:]+',                        field: period_start}
  # ── Real Estate ──
  - {pattern: 'lease\s+(?:start|begin\w*|commencement)[\s:]+', field: period_start}
  - {pattern: 'lease\s+(?:end|expir\w*|terminat\w*)[\s:]+',  field: period_end}
  - {pattern: '(?:close|closing)\s+date[\s:]+',              field: period_end}
  - {pattern: 'possession\s+date[\s:]+',                     field: period_start}
  - {pattern: 'move[\s\-]?in\s+date[\s:]+',                  field: period_start}
  - {pattern: 'move[\s\-]?out\s+date[\s:]+',                 field: period_end}
  - {pattern: 'recording\s+date[\s:]+',                      field: period_start}
  - {pattern: 'appraisal\s+date[\s:]+',                      field: period_start}
  - {pattern: 'list(?:ing)?\s+date[\s:]+',                   field: period_start}
  - {pattern: 'escrow\s+(?:open|close)\s+date[\s:]+',        field: period_start}
  - {pattern: 'property\s+tax\s+due[\s:]+',                  field: due_date}
  # ── Supply Chain / Logistics ──
  - {pattern: 'purchase\s+order\s+date[\s:]+',               field: period_start}
  - {pattern: 'goods\s+receipt\s+date[\s:]+',                field: period_start}
  - {pattern: 'bill\s+of\s+lading\s+date[\s:]+',             field: period_start}
  - {pattern: 'customs\s+(?:entry|clearance)\s+date[\s:]+',  field: period_start}
  - {pattern: 'export\s+date[\s:]+',                         field: period_start}
  - {pattern: 'import\s+date[\s:]+',                         field: period_start}
  - {pattern: 'estimated\s+(?:arrival|delivery)[\s:]+',      field: delivery_date}
  - {pattern: 'actual\s+(?:arrival|delivery)[\s:]+',         field: delivery_date}
  - {pattern: 'warehouse\s+receipt\s+date[\s:]+',            field: period_start}
  # ── Immigration ──
  - {pattern: '(?:visa|i-?94|i-?20|i-?797)\s+(?:issue|issued)\s+date[\s:]+', field: period_start}
  - {pattern: '(?:visa|passport|i-?94|status)\s+expir\w*[\s:]+', field: period_end}
  - {pattern: 'authorized\s+(?:stay|until|through)[\s:]+',   field: period_end}
  - {pattern: 'admission\s+(?:until|through|date)[\s:]+',    field: period_end}
