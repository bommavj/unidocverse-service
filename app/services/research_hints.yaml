# ─────────────────────────────────────────────────────────────────────────────
# Research Hints Configuration
#
# This file drives the document filter and question reasoner without any
# Python code changes. Add new doc types, field synonyms, or scoring weights
# here to extend coverage.
#
# Scoring (additive per document):
#   date  : +3 if month+year match filename, +2 if only one matches
#   type  : +2 if any doc_type keyword matches filename or db doc_type column
#   field : +1 if any field synonym matches filename
# ─────────────────────────────────────────────────────────────────────────────

# ── Document type keyword map ─────────────────────────────────────────────────
# Maps the reasoner's doc_type_hint to filename / db doc_type keywords.
# A document scores +2 if ANY keyword appears in its filename or doc_type.
